<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            {{cand.name.last}} {{cand.name.first}}
        </mat-card-title>
        <img mat-card-avatar [src]="cand.picture.thumbnail" [alt]="cand.email">
    </mat-card-header>
    <mat-card-content>
        <mat-list>
        @for (c of dataList; track c){
            <mat-list-item>
                <strong>{{c.text}} </strong> 
                <a [href]="c.prop+cand[c.key]">{{cand[c.key]}}</a>
            </mat-list-item>
            <mat-divider/> 
        }</mat-list>
    </mat-card-content>
    <mat-card-actions>
        <a mat-button [routerLink]="'/user/'+cand.login.uuid">VER PERFIL</a>
        <mat-button-toggle (click)="selectUser()">SELECCIONAR</mat-button-toggle>
    </mat-card-actions>
</mat-card>
